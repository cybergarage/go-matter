version: "2"
run:
  go: "1.25"
linters:
  default: all
  disable:
    - asasalint
    - containedctx
    - cyclop
    - depguard
    - dupl
    - dupword
    - err113
    - errcheck
    - exhaustive
    # A Matter message, a cluster payload and a cobra command are built from a
    # handful of the fields of a large struct, so requiring every field to be
    # written out adds a directive to almost every literal without finding a
    # defect.
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - godox
    - iface
    - inamedparam
    - ireturn
    - lll
    - makezero
    - mnd
    - musttag
    - nestif
    - nilnil
    - nlreturn
    - nolintlint
    - paralleltest
    - perfsprint
    - testpackage
    - unconvert
    - unparam
    - unused
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
    - maintidx
    - funcorder
    - testableexamples
    - noinlineerr
    - noctx
    - contextcheck
    - fatcontext
    - embeddedstructfieldcheck
    - predeclared
  settings:
    gocritic:
      disabled-checks:
        - singleCaseSwitch
        - dupArg
        # The crypto and the protocol code names its values after the Matter
        # specification, which writes the curve points and the transcript as
        # Z, V, M, N and L, and renaming them would hide that correspondence.
        - captLocal
    gosec:
      excludes:
        - G101
        - G115
        - G401
        - G505
    govet:
      disable:
        - printf
    interfacebloat:
      max: 100
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    staticcheck:
      checks:
        - all
        - -SA1006
        - -SA1008
        - -SA5008
        - -QF1008
        # SPAKE2+ multiplies and adds arbitrary curve points, which the
        # crypto/ecdh package that replaced crypto/elliptic does not expose,
        # so the deprecated low-level API is the only one which can express
        # the PAKE.
        - -SA1019
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
          - gosec
          - forcetypeassert
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: true
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
