name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'

    - name: Set up golangci-lint
      run: sudo snap install golangci-lint --classic

    - name: Set up bluez
      run: sudo apt-get install bluetooth

    - name: Test
      run: |
        set -o pipefail
        make test 2>&1 | tee test.log

    # Step logs can only be read signed in; annotations can be read by
    # anyone, so the failures go there.
    - name: Summarize test failures
      if: failure()
      run: |
        test -f test.log || exit 0
        msg=$(grep -E -- '--- FAIL|^FAIL|_test\.go:[0-9]+:|panic:' test.log | grep -v 'no test files' | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
        echo "::error title=Test failures::${msg}"

    # Disable coverage reports because BlueZ is not available in the GitHub Actions virtual environment.
    #- name: Upload coverage reports to Codecov
    #  uses: codecov/codecov-action@v7.0.1
    #  with:
    #    token: ${{ secrets.CODECOV_TOKEN }}
    #    slug: cybergarage/go-matter
    #    files: ./matter-cover.out

  # chip-tool, the controller of the Matter SDK, commissions the device in
  # matter/device over the network; it discovers the device through
  # avahi-daemon.
  chip-tool:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'

    - name: Set up Avahi
      run: |
        sudo apt-get update
        sudo apt-get install -y avahi-daemon avahi-utils
        sudo systemctl start avahi-daemon

    - name: Set up chip-tool
      run: |
        sudo snap install chip-tool
        sudo snap connect chip-tool:avahi-observe || true
        snap info chip-tool | grep -E '^(name|installed)'

    - name: Test with chip-tool
      env:
        # Fail, rather than skip, if chip-tool is not usable.
        GO_MATTER_TEST_REQUIRE: chip-tool
      run: |
        set -o pipefail
        make test-chip-tool 2>&1 | tee chip-tool-test.log

    # Step logs can only be read signed in; the job summary and the
    # annotations can be read by anyone, so the end of the log goes there.
    - name: Summarize the chip-tool test
      if: always()
      run: |
        test -f chip-tool-test.log || exit 0
        {
          echo '## chip-tool test'
          echo '```'
          grep -E -- '--- (PASS|FAIL|SKIP)|chiptool(_light)?_test.go|\$ chip-tool|Error|error|[Ff]ailed|FAIL|Timeout|timed out|Commissioning|Successfully' chip-tool-test.log | tail -n 150
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        # The results go to a notice too, so which tests ran can be read
        # without signing in; a chip-tool test which was skipped fails the
        # job, since this job exists to run them.
        results=$(grep -E -- '--- (PASS|FAIL|SKIP): TestChipTool' chip-tool-test.log | sed 's/^ *//' | awk '{printf "%s%%0A", $0}')
        echo "::notice title=chip-tool tests::${results}"
        if grep -q -- '--- SKIP: TestChipTool' chip-tool-test.log; then
          echo "::error title=chip-tool test skipped::A chip-tool test was skipped"
          exit 1
        fi
        if grep -q -- '--- FAIL' chip-tool-test.log; then
          # Which addresses chip-tool resolved and used tells a network
          # failure apart from a protocol one.
          addrs=$(grep -E 'IP Address|Address #|[Rr]esolv|UDP:|Hostname|Port:|OnNodeDiscovered|Discovered' chip-tool-test.log | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::warning title=chip-tool addresses::${addrs}"
          # The test's own lines, such as the chip-tool commands it ran
          # and why it failed, as opposed to the chip-tool output it
          # logged, which starts with chip-tool's "[timestamp]".
          for name in $(grep -oE -- '--- FAIL: TestChipTool[A-Za-z0-9_]+' chip-tool-test.log | awk '{print $3}'); do
            msg=$(awk -v name="$name" '/^=== (RUN|CONT) /{test=$3} test==name && /_test\.go:[0-9]+: [^[]/' chip-tool-test.log | sed 's/^ *//' | tail -n 30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${name} failed::${msg}"
            # And the last of what chip-tool printed in that test, which
            # tells why a command failed, even one that failed before
            # logging any error of its own.
            tail=$(awk -v name="$name" '/^=== (RUN|CONT) /{test=$3} test==name && /_test\.go:[0-9]+: \[/' chip-tool-test.log | sed 's/^ *//; s/^[a-z_]*_test\.go:[0-9]*: //' | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${name} chip-tool output::${tail:-chip-tool printed nothing}"
          done
        fi
