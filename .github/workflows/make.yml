name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'

    - name: Set up golangci-lint
      run: sudo snap install golangci-lint --classic

    - name: Set up bluez
      run: sudo apt-get install bluetooth

    - name: Test
      run: make test

    # Disable coverage reports because BlueZ is not available in the GitHub Actions virtual environment.
    #- name: Upload coverage reports to Codecov
    #  uses: codecov/codecov-action@v7.0.1
    #  with:
    #    token: ${{ secrets.CODECOV_TOKEN }}
    #    slug: cybergarage/go-matter
    #    files: ./matter-cover.out

  # chip-tool, the controller of the Matter SDK, commissions the device in
  # matter/device over the network; it discovers the device through
  # avahi-daemon.
  chip-tool:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'

    - name: Set up Avahi
      run: |
        sudo apt-get update
        sudo apt-get install -y avahi-daemon avahi-utils
        sudo systemctl start avahi-daemon

    - name: Set up chip-tool
      run: |
        sudo snap install chip-tool
        sudo snap connect chip-tool:avahi-observe || true
        snap info chip-tool | grep -E '^(name|installed)'

    - name: Test with chip-tool
      env:
        # Fail, rather than skip, if chip-tool is not usable.
        GO_MATTER_TEST_REQUIRE: chip-tool
      run: |
        set -o pipefail
        make test-chip-tool 2>&1 | tee chip-tool-test.log

    # Step logs can only be read signed in; the job summary and the
    # annotations can be read by anyone, so the end of the log goes there.
    - name: Summarize the chip-tool test
      if: always()
      run: |
        test -f chip-tool-test.log || exit 0
        {
          echo '## chip-tool test'
          echo '```'
          grep -E -- '--- (PASS|FAIL|SKIP)|chiptool_test.go|\$ chip-tool|Error|error|[Ff]ailed|FAIL|Timeout|timed out|Commissioning|Successfully' chip-tool-test.log | tail -n 150
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        if grep -q -- '--- FAIL' chip-tool-test.log; then
          msg=$(grep -E 'chiptool_test.go|Error|error|[Ff]ailed|Timeout|timed out' chip-tool-test.log | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=chip-tool test failed::${msg}"
        fi
