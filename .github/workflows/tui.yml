name: tui-offline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Download dependencies
        run: go mod download
        env:
          GOWORK: 'off'
      - name: Install lint
        run: sudo snap install golangci-lint --classic
      - name: Check TUI without network interfaces
        # A fresh network namespace has no host interfaces or usable network.
        # Dependencies are cached before entering it; only offline fixtures run.
        run: sudo -E unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups env PATH="$PATH" make check-tui
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Download dependencies
        run: go mod download
        env:
          GOWORK: 'off'
      - name: Install lint
        run: brew install golangci-lint
      - name: Offline checks and CoreBluetooth arm64 build
        run: make check-tui
