name: dcl-certs

# Refreshes the production PAAs and Certification Declaration signing
# certificates bundled in matter/credentials/production/certs from the
# Distributed Compliance Ledger, and opens a pull request when they changed.
# Creating the pull request needs "Allow GitHub Actions to create and approve
# pull requests" in the repository's Actions settings.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Fetch the trust anchors from the DCL
        run: make update-production-certs
      - name: Open a pull request when they changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add matter/credentials/production/certs
          if git diff --cached --quiet; then
            echo "The bundled trust anchors are up to date."
            exit 0
          fi
          branch="dcl-certs/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "chore(credentials): update the production trust anchors from the DCL"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(credentials): update the production trust anchors from the DCL" \
            --body "The PAAs and CD signing certificates of the Distributed Compliance Ledger changed. Generated by the dcl-certs workflow with \`make update-production-certs\`."
