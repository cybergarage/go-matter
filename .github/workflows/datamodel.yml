name: datamodel-offline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  metadata:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Download dependencies
        run: go mod download
        env:
          GOWORK: 'off'
      - name: Install lint on Linux
        if: runner.os == 'Linux'
        run: sudo snap install golangci-lint --classic
      - name: Install lint on macOS
        if: runner.os == 'macOS'
        run: brew install golangci-lint
      - name: Check offline generation, catalog and cross builds
        run: make check-datamodel
